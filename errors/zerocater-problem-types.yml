summary: >-
  Zerocater publishes no error reference. This catalog records only error envelopes
  observed live from app.zerocater.com during anonymous probing on 2026-08-05. The API
  uses the Django REST Framework default envelope — a flat JSON object with a single
  `detail` string — not RFC 9457 problem+json. There is no error code, no type URI, no
  machine-readable reason and no documentation link in any response body.
envelope:
  media_type: application/json
  shape: '{"detail": "<human-readable message>"}'
  fields:
  - name: detail
    type: string
    description: Human-readable message. The only field present in every observed error.
  missing:
  - machine-readable error code
  - type URI
  - RFC 9457 title/status/instance members
  - field-level validation pointers
  - documentation or remediation link
