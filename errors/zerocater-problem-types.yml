  observed_at: https://app.zerocater.com/api/v3/user
- status: 404
  title: Not found
  detail: Not found.
  media_type: application/json
  remediation: >-
    Returned for an unknown resource identifier. Note that this API returns 404 rather
    than 401 for non-token-gated resources, so a 404 does not by itself distinguish
    "does not exist" from "not visible to you".
  observed_at: https://app.zerocater.com/api/v3/companies/{short_mangled_id}
- status: 404
  title: Application HTML 404
  media_type: text/html
  detail: null
  remediation: >-
    Unrouted paths under /api/v3 fall through to the Django application's HTML 404 page
    instead of a JSON error, so a client parsing JSON will fail on the response body
    rather than on the status code. Observed for the login, register, password/forgot
    and password/reset relations advertised by the API root index.
  observed_at: https://app.zerocater.com/api/v3/login
- status: 500
  title: Server error
  media_type: text/html
  detail: null
  remediation: >-
    Observed once, from an anonymous OPTIONS request to the vendor_ratings relation.
    Recorded as observed, not diagnosed.
  observed_at: https://app.zerocater.com/api/v3/meals/{meal_id}/vendor_ratings
gaps:
