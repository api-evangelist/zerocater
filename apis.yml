apis:
- aid: zerocater:zerocater-api-v3
  name: Zerocater API v3
  description: 'The internal-but-anonymously-discoverable JSON API behind the Zerocater
    ordering application at app.zerocater.com. Built on Django REST Framework, it
    serves an RFC 6570 URI-template hypermedia index at its root listing 23 resource
    URLs covering companies, company people, meals, meal and vendor ratings, payment
    methods (including Plaid bank authorization), menu voting/suggestions/comments,
    and account operations. Reads are authenticated with an `Authorization: Token <token>`
    header. Zerocater publishes no OpenAPI, no developer portal and no public API
    documentation for this surface; the contract recorded here was probed live and
    corroborated against Zerocater''s own open-source Python client.'
  humanURL: https://github.com/ZeroCater/PyZeroCater
  baseURL: https://app.zerocater.com/api/v3
