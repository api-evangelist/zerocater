aid: zerocater
name: Zerocater
description: 'Zerocater is a San Francisco-founded corporate catering and workplace
  food company that builds and manages office food programs for businesses. It acts
  as an intermediary between employers and a curated network of local restaurants,
  caterers and chefs, covering daily corporate catering (buffet and individually boxed),
  chef-led on-site corporate cafeterias with snack and barista programs, and full-service
  event catering with on-site staffing. Its CaterAi product uses AI to recommend and
  assemble menus from a team''s stated preferences, dietary restrictions and order
  history, and to book on-site staff and event decor. Zerocater states it serves 500+
  companies across 12+ major U.S. metros including the SF Bay Area, New York, Austin,
  Boston, Los Angeles, Chicago, Washington DC, Seattle, Denver, Dallas, Atlanta, Philadelphia
  and Phoenix. It runs a customer-facing ordering web application at app.zerocater.com
  backed by an undocumented Django REST Framework token-authenticated JSON API (v3),
  whose hypermedia root index is served anonymously, and it publishes a first-party
  Python client library on PyPI.'
